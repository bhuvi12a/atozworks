version: "3.8"

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: atozworks-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: atozworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - atozworks-net

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: atozworks-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - atozworks-net

  # API Gateway Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atozworks-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:Password123@postgres:5432/atozworks?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=docker_env_access_secret_hash_value_32_characters
      - JWT_REFRESH_SECRET=docker_env_refresh_secret_hash_value_64_characters
      - RAZORPAY_KEY_ID=rzp_test_mockkeyid
      - RAZORPAY_KEY_SECRET=mockkeysecret
    depends_on:
      - postgres
      - redis
    networks:
      - atozworks-net

volumes:
  pgdata:
  redisdata:

networks:
  atozworks-net:
    driver: bridge
